[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-sandbox-factory"
version = "2026.11.12.232958"
description = "Manage isolated Pi and Pendant workspaces with installable profiles and model providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual==8.1.1", "pyfiglet>=1.0.2,<2", "packaging>=24", "argon2-cffi>=23.1,<26"]

[project.urls]
Homepage = "https://github.com/kyuz0/pi-sandbox-factory"
Repository = "https://github.com/kyuz0/pi-sandbox-factory"
Issues = "https://github.com/kyuz0/pi-sandbox-factory/issues"

[project.scripts]
pi-sandbox-factory = "pi_sandbox_factory.sandbox:main"

[tool.setuptools]
packages = ["pi_sandbox_factory"]
include-package-data = true

[tool.setuptools.package-data]
pi_sandbox_factory = ["containers/**/*", "profiles/**/*", "providers/**/*", "checks/*", "network-catalog/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo", "containers/inference/node_modules/*"]
