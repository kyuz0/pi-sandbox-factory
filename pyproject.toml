[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-sandbox-factory"
version = "2026.11.23.190523"
description = "Migration launcher for AI Sandbox Factory"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/kyuz0/ai-sandbox-factory"
Repository = "https://github.com/kyuz0/pi-sandbox-factory"

[project.scripts]
pi-sandbox-factory = "pi_factory_migration:main"

[tool.setuptools]
packages = ["pi_factory_migration", "pi_sandbox_factory"]
