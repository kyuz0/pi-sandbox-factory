[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vscode-pi-sandbox"
version = "0.2.0a1"
description = "Manage isolated Pi and Pendant workspaces with installable profiles and model providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual==8.1.1"]

[project.scripts]
pi-sandbox = "vscode_pi_sandbox.sandbox:main"

[tool.setuptools]
packages = ["vscode_pi_sandbox"]
include-package-data = true

[tool.setuptools.package-data]
vscode_pi_sandbox = ["containers/**/*", "profiles/**/*", "providers/**/*", "checks/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
