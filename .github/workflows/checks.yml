name: Migration launcher checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m pip wheel --no-deps . -w dist
      - run: |
          python -m venv /tmp/launcher-check
          /tmp/launcher-check/bin/pip install dist/pi_sandbox_factory-*.whl
          cd /tmp
          /tmp/launcher-check/bin/python -I -c 'import pi_factory_migration, pi_sandbox_factory.sandbox'
