name: Checks and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      package_changed: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for package changes
        id: package
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE=$(git hash-object -t tree /dev/null)
          fi
          status=0
          git diff --quiet "$BEFORE" "$AFTER" -- pi_sandbox_factory/ pyproject.toml MANIFEST.in || status=$?
          case "$status" in
            0) echo 'changed=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'changed=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require dependency pins on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_dependency_main.py
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci --prefix pi_sandbox_factory/containers/inference --ignore-scripts
      - run: node --test tests/test_provider_runtime.mjs tests/test_web_search_policy.mjs tests/test_inference_broker.mjs
      - run: |
          python -m pip wheel --no-deps . -w dist
          python -m venv /tmp/factory-package
          /tmp/factory-package/bin/pip install dist/pi_sandbox_factory-*.whl
          cd /tmp
          /tmp/factory-package/bin/pi-sandbox-factory --version
          /tmp/factory-package/bin/pi-sandbox-factory profile list
          /tmp/factory-package/bin/pi-sandbox-factory provider list
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.package_changed == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Version and tag
        run: |
          python - <<'PYTHON'
          from datetime import datetime, timezone
          from pathlib import Path
          import re, subprocess
          now = datetime.now(timezone.utc)
          version = f'{now.year}.{now.month}.{now.day}.{int(now.strftime("%H%M%S"))}'
          path = Path('pyproject.toml')
          path.write_text(re.sub(r'^version = ".*"$', f'version = "{version}"', path.read_text(), flags=re.M))
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'pyproject.toml'], check=True)
          subprocess.run(['git', 'commit', '-m', f'Release {version}'], check=True)
          subprocess.run(['git', 'tag', 'v' + version], check=True)
          subprocess.run(['git', 'push', '--atomic', 'origin', 'HEAD:main', 'v' + version], check=True)
          PYTHON
